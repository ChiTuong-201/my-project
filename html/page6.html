<!DOCTYPE html>
<htmt lang = "vi">
	<head>
		<title> Tính Diện tích hình chữ nhật </title>
		<meta char set= "utf-8"> 
	</head>
	<body>

			<script>
			let d = Number(prompt("Hãy chiều dài hình chữ nhật:"));
			let r = Number(prompt("Hãy chiều rộng hình chữ nhật:"));
				if(d<r)
				alert("Chiều dài nhỏ hơn chiều rộng");
				else if(d==r)
				alert("Trường hợp đặt biệt diện tích hình vuông là:"+d*r);
				else
				alert ("Diện tích hình chữ nhật là:"+d*r);
			</script>
	</body>
</html>
