<!DOCTYPE html>
<htmt lang = "vi">
	<head>
		<title> Trang 2 </title>
		<meta char set= "utf-8"> 
		<link rel ="stylesheet" href ="../css/style3.css">
	</head>
	<body>
		<div class = "container">
		<form id="frmLogin">
			<h2 id ="title">Đăng Ký Thông Tin CLB  Bóng Chuyền</h2>
			<div class ="form-group">
			<label form ="textUsername">Tên Đăng Nhập</label>
			<input class ="form-control" type ="text" id ="textUsername" name="textUsername" >
			</div>
			<div class ="form-group">
			<label form ="textPass">Mật Khẩu</label>
			<input class ="form-control" type ="password" id ="textPass" name="textPass" >
			</div>
			<div class ="form-group">
			<label form ="textHoten">Họ Và Tên</label>
			<input class ="form-control" type ="text" id ="textHoten" name="textHoten" >
			</div>
			<div class ="form-group">
			<label form ="textNgay">Ngày Tháng Năm Sinh</label>
			<input class ="form-control" type ="text" id ="textNgay" name="textNgay" >
			</div>
			<div class ="form-group">
			<label form ="textGioitinh">Giới Tính</label>
			<select>
				<option>Nam</option>
				<option>Nữ</option>
			</select>
			<div class ="form-group">
			<label form ="textGioitinh">Vị Trí</label>
			<select>
				<option>Chủ Công</option>
				<option>Phụ Công</option>
				<option>Đối Chuyền</option>
				<option>Chuyền Hai</option>
				<option>Libero</option>
			</select>
			</div>
			<input class ="form-button" type="submit" id="smXác Nhận" name="smXác Nhận" value="Xác Nhận">

			</form>
		</div>
	</body>
</html>
