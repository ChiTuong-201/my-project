
<!DOCTYPE html>

        <div class ="container" id ="container">
            <img src = "../acssets/images/conmeo.jpg" alt = "" id ="image">
            <p id ="name"></p>
            <p id = "price"></p>

        <script>
            //1.Lấy Id Từ URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('masp');
            // Tim San Pham
            const foundProduct = products.find(
                obj => obj.id.trim() === productId.trim());
            // Hien Thi Du Lieu Ra Giao Dien
            if(foundProduct){
                document.getElementById("name").innerText = foundProduct.name;
                document.getElementById("price").innerText = foundProduct.price;
                document.getElementById("mtct").innerText = "Mô Tả Chi Tiết :"+ foundProduct.mtct;
                document.getElementById("description").innerText = foundProduct.description;
                document.getElementById("image").src = foundProduct.image;
            }else{
                document.getElementById("container").innerHTML = '<h2> san pahm khòn ton tai hoac da ngung kinh doanh</h2> <a href = "../index.html">Quay Lai Trang Chu"</a>'
            }

        </script>
